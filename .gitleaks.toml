# gitleaks configuration for Archie.
#
# Scope: this file narrows FALSE POSITIVES only. It must never be used to
# silence a real credential. Every entry below was verified by hand on
# 2026-07-30 against commit f35ff1a, which produced all 10 findings in the first
# scan that ever actually ran (CI had been failing before it scanned anything).
#
# If a scan fails, read the finding before touching this file. The default
# assumption is that gitleaks is right.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[rules.allowlist]
regexTarget = "match"
regexes = [
  # Deliberately invalid JWTs in code-generation TEMPLATES (.j2). These are
  # fixtures for the projects Archie generates - tokens whose signature is the
  # literal string "invalid", or which are assembled at test runtime via btoa().
  # They authenticate against nothing.
  '''eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*\.?(invalid|[A-Za-z0-9_-]*)['"]?\s*\+?\s*$''',
]
paths = [
  # Vendor seed catalogues and AI prompt text: prose such as
  #   "authentication": "Integrated/SQL Auth"
  #   - API gateway, ESB/Integration platform, Message brokers
  # trips the generic-api-key entropy rule. These are product descriptions.
  '''app/commands/vendor_seeds_.*\.py''',
  '''app/modules/architecture/services/archimate_prompts\.py''',
  # Test fixtures inside code-generation templates.
  '''app/modules/solutions_product/templates/.*/(__tests__/.*|test_.*)\.(j2|tsx|py)''',
  # This very file documents the findings above, so it quotes the strings that
  # trigger them. gitleaks scans all history, so rewording the current copy does
  # not clear the commit that introduced it. Scoped to this one file.
  '''docs/REPOSITORIES\.md''',
]

[[rules]]
id = "curl-auth-header"
[rules.allowlist]
paths = [
  # Documentation showing users how to test their OWN key. The literal text is
  #   -H "Authorization: Bearer YOUR_OPENAI_API_KEY"
  '''.*\.md''',
]
