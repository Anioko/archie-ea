  - id: whole-file-copies
    name: Whole-file copies of services
    plain_words: A file copied into a second folder and left there.
    decision: proposed
    decision_owner: tech-lead
    canonical:
      kind: pattern
      paths: [app/services/llm_service.py]
      use: "Keep one implementation under app/modules/<module>/. In the old path leave a shim of at most 15 lines that re-exports it and names the canonical file in its docstring (see app/services/llm_service.py)."
    allowed_specialisations: []
    forbidden:
      - Copying a file to a second folder instead of importing it.
      - Creating a v2 or hardened copy of a file beside the original.
    rules: [RG-3a, RG-3b]
    known_duplicates:
      - {path: app/services/roadmap_automation.py, verdict: true_duplicate, converge: S}
      - {path: app/services/roadmap_validator.py, verdict: true_duplicate, converge: S}
