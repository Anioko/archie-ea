      - {path: app/services/gap_analysis_service.py, verdict: true_duplicate, converge: M}
      - {path: app/services/ai_import_service.py, verdict: true_duplicate, converge: M}
    converge_effort: M
    owner_role: tech-lead
    search_hints:
      - "python reuse-measure-v1.py --root . --list RG-3b"
      - "find app -name '*_service.py' -not -path '*/tests/*'"
    last_checked: *v

