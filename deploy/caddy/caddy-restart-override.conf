# The app droplet has restart:unless-stopped, a healthcheck and a watchdog.
# Caddy is the SINGLE ingress every request passes through and had none of that:
# `systemctl cat caddy` shows no Restart= directive, so systemd's default of
# Restart=no applied. If the process died, nothing brought it back.
[Service]
Restart=on-failure
RestartSec=3s
