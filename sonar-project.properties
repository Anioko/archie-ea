# SonarQube Configuration for Archie Enterprise Architecture Platform
# =============================================================================

# Project key and metadata
sonar.projectKey=archie-oss
sonar.projectName=Archie Enterprise Architecture Platform
sonar.projectVersion=1.0.0

# Organization (set by CI environment variable SONAR_HOST_URL or use SonarCloud)
# Default: set to your SonarCloud organization slug via secrets
sonar.organization=${SONAR_ORGANIZATION}

# Source and test paths
sonar.sources=app,config.py,create_admin.py,diag_tenancy.py,diag_tenancy2.py,f.py,gunicorn.conf.py,manage.py,qc.py,qv.py,r2.py,r3.py,readgen.py,recheck.py,si.py
sonar.tests=tests

# Language specifications
sonar.language=py
sonar.sourceEncoding=UTF-8

# Python version (matches CI and runtime)
sonar.python.version=3.12

# Coverage and test report paths
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclusions: vendored assets, migrations, generated templates, caches
sonar.exclusions=\
  **/node_modules/**,\
  **/migrations/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  app/static/vendor/**,\
  app/static/templates/**,\
  app/modules/solutions_product/templates/**,\
  .git/**,\
  .pytest_cache/**,\
  .coverage*,\
  htmlcov/**,\
  playwright-report/**,\
  **/.env**

# Test file inclusions
sonar.test.inclusions=tests/**/*.py

# Coverage exclusions (don't count towards coverage thresholds)
sonar.coverage.exclusions=\
  tests/**,\
  **/test_*.py,\
  **/migrations/**,\
  app/modules/solutions_product/templates/**

# Duplication exclusions
sonar.cpd.exclusions=\
  **/migrations/**,\
  app/modules/solutions_product/templates/**,\
  app/static/vendor/**

# Silence non-critical issues for generated/external code
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=app/modules/solutions_product/templates/**
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S1442
sonar.issue.ignore.multicriteria.e2.resourceKey=app/static/vendor/**
