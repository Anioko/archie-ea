# SonarCloud configuration for Archie.
#
# Set sonar.organization below to your SonarCloud organisation slug before the
# first run. It is NOT set here as ${SONAR_ORGANIZATION}: this is a plain
# properties file and Sonar performs no environment-variable interpolation, so
# such a value is sent literally and the analysis is rejected.

sonar.projectKey=archie-oss
sonar.projectName=Archie Enterprise Architecture Platform
# sonar.organization=<your-sonarcloud-org-slug>

# Analyse the whole tree and subtract with exclusions, rather than enumerating
# source files - an explicit list silently stops covering new code as the
# project grows.
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.sourceEncoding=UTF-8

# Deliberately NOT setting sonar.language: it is deprecated and pins analysis to
# a single language, which would drop the JavaScript under app/static/js.
sonar.python.version=3.12

# Produced by the tests job and consumed here via the test-reports artifact.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

sonar.exclusions=\
  **/node_modules/**,\
  **/migrations/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  app/static/vendor/**,\
  app/static/templates/**,\
  app/modules/solutions_product/templates/**,\
  code_templates/**,\
  .git/**,\
  .pytest_cache/**,\
  .coverage*,\
  htmlcov/**,\
  playwright-report/**,\
  **/.env**

sonar.coverage.exclusions=\
  tests/**,\
  **/test_*.py,\
  **/migrations/**,\
  code_templates/**,\
  app/modules/solutions_product/templates/**

sonar.cpd.exclusions=\
  **/migrations/**,\
  code_templates/**,\
  app/modules/solutions_product/templates/**,\
  app/static/vendor/**
