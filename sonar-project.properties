# SonarQube configuration for Archie.
#
# Target is a SELF-HOSTED SonarQube (Community Build, LGPLv3). Community Build is
# free and analyses private code with no licence; only SonarQube CLOUD charges
# for private repositories. The two were conflated when this was first set up and
# a SonarCloud CI job was added that could never run - it reported a green tick
# because it SKIPPED. That job has been removed; use scripts/ci/sonar-scan.sh.
#
# No sonar.organization key: that is a SonarCloud concept and is rejected by a
# self-hosted server. It also cannot be written as ${SONAR_ORGANIZATION} here,
# because properties files are not interpolated - the literal string is sent.

sonar.projectKey=archie-oss
sonar.projectName=Archie Enterprise Architecture Platform
# sonar.organization=<your-sonarcloud-org-slug>

# Analyse the whole tree and subtract with exclusions, rather than enumerating
# source files - an explicit list silently stops covering new code as the
# project grows.
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.sourceEncoding=UTF-8

# Deliberately NOT setting sonar.language: it is deprecated and pins analysis to
# a single language, which would drop the JavaScript under app/static/js.
sonar.python.version=3.12

# Produced by the tests job and consumed here via the test-reports artifact.
# Both are ALSO listed in sonar.exclusions below. Without that, coverage.xml is
# indexed as an XML *source* file - 9.8MB of it - which inflated ncloc from
# ~819k to ~1,090k lines and skewed every ratio derived from it.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

sonar.exclusions=\
  coverage.xml,\
  test-results.xml,\
  **/node_modules/**,\
  **/migrations/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  app/static/vendor/**,\
  app/static/templates/**,\
  app/modules/solutions_product/templates/**,\
  code_templates/**,\
  .git/**,\
  .pytest_cache/**,\
  .coverage*,\
  htmlcov/**,\
  playwright-report/**,\
  **/.env**

sonar.coverage.exclusions=\
  tests/**,\
  **/test_*.py,\
  **/migrations/**,\
  code_templates/**,\
  app/modules/solutions_product/templates/**

sonar.cpd.exclusions=\
  **/migrations/**,\
  code_templates/**,\
  app/modules/solutions_product/templates/**,\
  app/static/vendor/**
