name: CI

# Gates for a public AGPL repo. Every job here is a HARD gate — nothing is
# advisory, and nothing is allowed to pass by being skipped.
#
# The previous version of this file had a `lint` job with BOTH
# `continue-on-error: true` AND `ruff check . || true`, i.e. doubly neutered: it
# could not fail. It has been replaced by the ratcheted static-gates job below,
# which fails when a measurement gets worse than the recorded baseline. See
# docs/adr/0001-verification-strategy.md for why ratchets rather than a big-bang
# clean-up.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Pinned deliberately. The ratchet baselines in verification_baseline.json are a
  # measurement made with a specific Ruff version; a floating install can report more
  # findings for the same code and fail the ratchet for a reason unrelated to the
  # change under review. Bump this and re-run `scripts/verify.py --update-baseline`
  # in the same commit. Keep in step with .pre-commit-config.yaml.
  RUFF_VERSION: "0.16.0"

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so the scan covers every commit
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required since gitleaks-action v2: without it the action exits
          # immediately with "GITHUB_TOKEN is now required to scan pull requests".
          # This gate had been failing in ~9s on every PR since at least
          # 2026-07-21 — so the repository's one nominally-hard gate was in fact
          # not scanning anything.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  static-gates:
    name: Static gates (compile + ratchets)
    runs-on: ubuntu-latest
    # No database, no app boot: seconds, not minutes. Fails fast on the cheapest
    # signal before the heavier jobs spend time.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install gate tooling
        # Ruff plus pip-audit: scripts/verify.py and the check_* scripts are
        # stdlib-only, so these gates run without installing app dependencies.
        run: python -m pip install --upgrade pip "ruff==${RUFF_VERSION}" pip-audit
      - name: Compile + lint ratchets + design tokens + air-gap
        run: python scripts/verify.py --tag static
      - name: Dependency CVE gate
        # Run the scan an enterprise security review would run, before they do.
        run: python scripts/verify.py --gate dependency-cves

  boot-health:
    name: Boot health (no database)
    runs-on: ubuntu-latest
    # Catches the class of failure nothing else here can see: a blueprint that
    # silently fails to register, or a url_for() endpoint that no longer resolves
    # (a BuildError 500 on every page rendering the sidebar).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Boot + wiring gate
        env:
          FLASK_CONFIG: testing
          SECRET_KEY: ci-only-not-secret
        run: python scripts/verify.py --gate boot-health

  tests:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: archie_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      # TestingConfig reads TEST_DATABASE_URL — not DATABASE_URL. The previous
      # workflow set only DATABASE_URL and passed by coincidence, because the
      # TestingConfig fallback happened to match this service's host/port/dbname.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/archie_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/archie_test
      # create_app() selects config from FLASK_CONFIG. FLASK_ENV (set here before)
      # has no effect on config selection.
      FLASK_CONFIG: testing
      SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
      - name: Create schema
        run: |
          python -c "import psycopg2" 2>/dev/null || pip install psycopg2-binary
          flask --app manage init-db
      - name: Run tests with coverage
        # --maxfail keeps the log readable while still surfacing many failures.
        run: |
          pytest -q --maxfail=20 \
            --cov=app --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Coverage summary
        # Published, not gated. Establishing the number is step one; a
        # do-not-decrease gate follows once a baseline exists on main.
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("coverage.xml").getroot()
          except (OSError, ET.ParseError):
              print("no coverage.xml produced")
              raise SystemExit(0)
          rate = float(root.get("line-rate", 0)) * 100
          covered = root.get("lines-covered", "?")
          valid = root.get("lines-valid", "?")
          print(f"line coverage: {rate:.2f}%  ({covered}/{valid} statements)")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  db-gates:
    name: Database gates (schema drift)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: archie_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/archie_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/archie_test
      FLASK_CONFIG: testing
      SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create schema
        run: flask --app manage init-db
      - name: Generate SBOM (CycloneDX)
        # From the INSTALLED environment, not requirements.txt: the latter pins
        # ranges, so a requirements-derived SBOM has no resolved versions and no
        # licence data — useless for a security review.
        run: |
          pip install cyclonedx-bom
          python -m cyclonedx_py environment -o sbom.cyclonedx.json
          python - <<'PY'
          import json
          d = json.load(open("sbom.cyclonedx.json", encoding="utf-8"))
          c = d.get("components", [])
          print(f"SBOM: {len(c)} components, spec {d.get('specVersion')}")
          print(f"  with version: {sum(1 for x in c if x.get('version'))}")
          print(f"  with licence: {sum(1 for x in c if x.get('licenses'))}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: warn
      - name: Schema drift gate
        # --require-db turns a missing database into a FAILURE rather than a skip,
        # so this gate cannot silently pass by not running.
        run: python scripts/verify.py --gate schema-drift --require-db
