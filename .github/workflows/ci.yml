name: CI

# Open-source CI for Archie. Three gates that matter for a public AGPL repo:
#   1. secret-scan  — keep the clean-room clean as contributions arrive (HARD gate)
#   2. tests        — pytest
#   3. lint         — advisory (non-blocking until the codebase is lint-clean)
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so the scan covers every commit
      # Runs the gitleaks CLI directly instead of gitleaks/gitleaks-action@v2.
      # The action refuses to run on a GitHub *organisation* without a paid
      # licence ("[saint-gobain-archie] is an organization. License key is
      # required."), and before that it aborted on a missing GITHUB_TOKEN. Every
      # CI run had been red since mid-June for those reasons alone - never
      # because a secret was found - which made real failures indistinguishable
      # from the false alarm. The scanner itself is free and open source; only
      # the convenience wrapper is licensed.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest             detect --source=/repo --redact --verbose --no-banner --exit-code 1
        # --verbose is deliberate: without it gitleaks prints only "leaks found: N"
        # and names nothing, which is unactionable. --redact keeps the secret values
        # themselves out of the build log.

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: archie_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/archie_test
      FLASK_ENV: testing
      SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          [ -f requirements-test.txt ] && pip install -r requirements-test.txt || true
      - name: Run tests
        run: pytest -q --maxfail=20 --cov=app --cov-report=xml:coverage.xml --junitxml=test-results.xml
      - name: Upload coverage + test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true        # advisory until the tree is lint-clean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check . || true

  sonarcloud:
    name: SonarCloud (advisory)
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    continue-on-error: true      # advisory, like lint - never blocks a merge
    env:
      # Job-level env so the step below can gate on it. A job-level
      # `if: secrets.X != ''` is NOT possible (the secrets context is
      # unavailable there), and `vars.X` reads repository VARIABLES, which stay
      # empty when only a SECRET is configured - that gate would never fire.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: Sonar needs it for blame/new-code
      - name: Download coverage from the tests job
        uses: actions/download-artifact@v4
        continue-on-error: true   # analysis is still useful without coverage
        with:
          name: test-reports
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Explain skip
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN is not set - skipping SonarCloud analysis (advisory job)."
