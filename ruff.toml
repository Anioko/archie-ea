# Ruff configuration — pinned deliberately.
#
# The rule set is stated explicitly rather than relying on Ruff's defaults so the
# ratchet baselines in verification_baseline.json stay reproducible when Ruff is
# upgraded. Changing `select` invalidates those baselines — re-measure with
# `python scripts/verify.py --update-baseline` in the same commit.
#
# Scope is correctness, not style. F/E4/E7/E9 catch defects that actually break at
# runtime (undefined names, redefinitions, broken f-strings). Style families (UP,
# BLE, DTZ, I, RUF...) add ~30k findings on this tree and are intentionally left
# out of the gate: gating on them would mean either a multi-month cleanup or a
# blanket noqa sweep, and neither improves correctness. Run them ad hoc if you
# want the cleanup backlog.

target-version = "py312"
line-length = 100

exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "migrations/versions",   # historical Alembic revisions; not maintained code
    "app/static",
    "node_modules",
    "code_templates",        # emitted scaffolding, not application code
]

[lint]
select = ["F", "E4", "E7", "E9"]

ignore = [
    # E711/E712 are WRONG for this codebase and must not be "fixed".
    #
    # SQLAlchemy builds SQL from operator overloading, so a filter is written
    #     .filter(FeatureFlag.parent_id == None)
    #     .filter(ElementTemplate.is_active == True)
    # and `==` is what produces `IS NULL` / `= true` in the emitted SQL. Rewriting
    # either to `is None` / `is True`, which is what these rules ask for and what
    # `ruff --fix` would do, evaluates in Python instead and yields a plain bool —
    # the predicate silently disappears from the query and the filter stops
    # filtering. That is a data-correctness bug with no visible error.
    #
    # 114 of the findings under these two rules were SQLAlchemy expressions.
    # Disabling them project-wide is the standard practice for SQLAlchemy projects
    # and is preferred here over 114 individual noqa comments.
    "E711",
    "E712",
]

[lint.per-file-ignores]
# Test modules legitimately import fixtures for side effects and shadow names.
"tests/*" = ["F811", "F401"]
