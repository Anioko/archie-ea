{% extends 'layouts/base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto py-8">
  <h1 class="text-2xl font-bold mb-4">Security Dashboard</h1>
  <div class="bg-background shadow rounded p-6 mb-6">
    <h2 class="text-lg font-semibold mb-2">Security Headers</h2>
    <table class="min-w-full text-sm">
      <thead><tr><th class="text-left">Header</th><th class="text-left">Value</th></tr></thead>
      <tbody>
        {% for k, v in headers.items() %}
        <tr><td class="font-mono">{{ k }}</td><td class="font-mono">{{ v }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  <div class="bg-background shadow rounded p-6 mb-6">
    <h2 class="text-lg font-semibold mb-2">Rate Limit Stats</h2>
    <table class="min-w-full text-sm">
      <thead><tr><th class="text-left">Key</th><th class="text-left">Count, Timestamp</th></tr></thead>
      <tbody>
        {% for key, val in rate_limit_stats %}
        <tr><td class="font-mono">{{ key }}</td><td class="font-mono">{{ val }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
